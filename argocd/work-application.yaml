apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argoxd-work
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Holajuwon/argoxd.git
    targetRevision: HEAD
    path: work
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
