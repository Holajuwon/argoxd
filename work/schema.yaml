models:
  User:
    type: object
    required:
      - id
      - name
    properties:
      id:
        type: string
        format: uuid
      name:
        type: string
      email:
        type: string
        format: email
  Event:
    type: object
    required:
      - type
      - payload
    properties:
      type:
        type: string
      payload:
        type: object
      timestamp:
        type: string
        format: date-time
