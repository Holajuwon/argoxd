replicaCount: 1

image:
  repository: node
  tag: "24-alpine"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

config:
  NODE_ENV: production
  PORT: "3000"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

# Standalone APIC instance credentials
# Sensitive values (password) should be supplied via a separate values file
# that is NOT committed to git (see charts/argoxd/values-secret.yaml.example)
standalone:
  url:      "https://idig.fyre-ci-299620-master-1.dev.fyre.ibm.com"
  username: "administrator"
  password: ""   # override via values-secret.yaml
