apiVersion: v1
kind: Secret
metadata:
  name: {{ include "argoxd.fullname" . }}-standalone
  labels:
    {{- include "argoxd.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  STANDALONE_URL:      {{ .Values.standalone.url | quote }}
  STANDALONE_USERNAME: {{ .Values.standalone.username | quote }}
  # STANDALONE_PASSWORD is injected out-of-band via:
  #   kubectl patch secret argoxd-standalone -n default \
  #     --type merge -p '{"stringData":{"STANDALONE_PASSWORD":"<value>"}}'
  # ArgoCD is configured to ignore this field (see argocd/application.yaml).
