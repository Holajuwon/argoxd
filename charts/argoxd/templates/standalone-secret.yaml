{{- $secretName := printf "%s-standalone" (include "argoxd.fullname" .) }}
{{- $existing   := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $password   := "" }}
{{- if $existing }}
{{- $password = index $existing.data "STANDALONE_PASSWORD" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "argoxd.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  STANDALONE_URL:      {{ .Values.standalone.url | quote }}
  STANDALONE_USERNAME: {{ .Values.standalone.username | quote }}
  STANDALONE_PASSWORD: {{ $password | quote }}
